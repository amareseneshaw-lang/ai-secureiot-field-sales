# Render Blueprint - see https://render.com/docs/blueprint-spec
#
# Defines exactly the architecture requested:
#   Browser -> Render web service (Docker: React/Vite build + FastAPI /api/*, same origin)
#           -> Managed PostgreSQL
#
# This file is infrastructure-as-code only - applying it (via "New +" > "Blueprint" in the
# Render dashboard, pointed at this repo) is what actually provisions anything. Authoring
# it here does not deploy or create any Render resources by itself.

databases:
  - name: ai-secureiot-db
    databaseName: ai_secureiot
    user: ai_secureiot
    plan: free # raise to a paid plan before real production traffic - see docs/DEPLOYMENT.md

services:
  - type: web
    name: ai-secureiot-field-sales
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free # raise to a paid plan for production - free instances spin down when idle
    healthCheckPath: /health
    # Render's Docker build uses this Dockerfile as-is; PORT is injected by Render at run
    # time and read via the Dockerfile's `--port "${PORT:-8000}"` - no extra config needed.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-secureiot-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates a fresh random value on first deploy;
        # this is exactly the "newly generated production secret" requirement - never a
        # value copied from local dev, CI, or any other environment.
      - key: ANTHROPIC_API_KEY
        sync: false # optional - leave unset in the Render dashboard to run without the
        # AI Insight feature; set it there (never in this file) to enable it.
      - key: SEED_DEMO_DATA
        sync: false # optional, off unless you set it - see "First deployment" in
        # docs/DEPLOYMENT.md. Set to "true" in the Render dashboard's Environment tab,
        # as a separate deliberate step AFTER the first deploy, to load
        # database/seed.sql's FICTIONAL demo accounts/customers/sites/devices exactly
        # once (backend/app/demo_seed.py). Leave unset/false for a deployment that
        # holds, or will ever hold, real data - this variable is never set to "true"
        # by this file itself.
    # No preDeployCommand: that field requires a paid Render plan and is intentionally
    # not used here (this deploys on the free plan, no billing). Instead, the app itself
    # applies database/schema.sql idempotently on every startup (see the lifespan hook in
    # backend/app/main.py / backend.app.database.initialize_schema) - this initializes a
    # fresh database automatically on first deploy, with no manual step required, and is
    # a no-op (not an error, not a re-apply) on every later restart once the schema
    # exists. database/seed.sql is only ever applied via the explicit SEED_DEMO_DATA
    # opt-in above, and even then only once (idempotent - see backend/app/demo_seed.py).
