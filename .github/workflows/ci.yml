name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # Throwaway CI-only credentials, scoped to the ephemeral postgres service container
    # below - never valid outside this workflow run, and never to be reused as real
    # dev/staging/production values (see .env.example).
    env:
      DATABASE_URL: postgresql://postgres:ci-postgres-password@localhost:5432/ai_secureiot
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: ai_secureiot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Import app (smoke test)
        run: python -c "import backend.app.main"

      - name: Apply schema and demo seed data
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed.sql
        env:
          PGPASSWORD: ci-postgres-password

      - name: Run tests
        run: |
          if find tests -name 'test_*.py' -print -quit | grep -q .; then
            pip install pytest
            python -m pytest
          else
            echo "No tests found, skipping."
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
